
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Primel Parcial</title>
</head>
<body>

    <header>
        <h1>Formulario de pedidos</h1>
    </header>

    <main>
        <form id="formulario">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" min="1" required>
            <br><br>

            <label for="precio">Precio unitario:</label>
            <input type="number" id="precio" min="0.01" step="0.01" required>
            <br><br>

            <button type="submit">Calcular pedido</button>
        </form>

        <section id="resultado">
            <h2>Resultado</h2>
            <p>Ingrese los datos del pedido.</p>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
